name: Build DNS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract 
       run: unzip -q DNS_Switch_1_3_FINAL_for_Samsung_S25.zip && rm -rf S25-DNS-Switch/gradle/uses
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: S25-DNS-Switch
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DNS-Switch-S25-APK
          path: S25-DNS-Switch/app/build/outputs/apk/debug/app-debug.apk
